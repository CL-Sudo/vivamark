<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>vivamark</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/_vivamark/chrome.css">
<script src="/_vivamark/chrome.js" defer></script>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><span class="logo" aria-hidden="true"></span>vivamark</div>
    <div class="file"><span id="file-name">…</span><span class="chip" id="reload-chip" hidden>updated</span></div>
    <button type="button" class="toggle" id="show-changes" aria-pressed="false" disabled title="Nothing has changed since you last sent">Show changes</button>
    <span class="turn" id="turn" data-turn="reviewer">Your turn</span>
    <div class="presence" id="presence" data-state="away"><span class="dot" aria-hidden="true"></span><span id="presence-text">Agent away</span></div>
  </header>
  <div class="body">
    <main class="stage">
      <iframe id="page" title="Page under review"
        sandbox="allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-downloads"
        referrerpolicy="no-referrer"></iframe>
      <div class="banner" id="banner" hidden></div>
    </main>
    <aside class="side" aria-label="Notes">
      <div class="side-title">Notes <span class="count" id="note-count">0</span></div>
      <div class="thread" id="thread" aria-live="polite"></div>
      <div class="ended" id="ended" role="status" hidden><div class="ended-head" id="ended-head">This review has ended</div><p class="ended-message" id="ended-message" hidden></p></div>
      <form class="composer" id="composer" autocomplete="off">
        <div class="target" id="target">
          <span class="target-label">On</span>
          <span class="target-text" id="target-text">the whole page</span>
          <button type="button" class="icon" id="target-clear" title="Clear target" hidden>×</button>
        </div>
        <div class="tags" id="tags">
          <div class="seg" role="group" aria-label="Intent">
            <button type="button" class="tag" data-intent="change" aria-pressed="false" title="Change this (C)">Change</button>
            <button type="button" class="tag" data-intent="question" aria-pressed="false" title="A question, not an instruction (Q)">Question</button>
            <button type="button" class="tag" data-intent="delete" aria-pressed="false" title="Remove this (D)">Delete</button>
            <button type="button" class="tag" data-intent="looks-good" aria-pressed="false" title="Keep this as it is (G)">Looks good</button>
          </div>
          <div class="seg" role="group" aria-label="Severity">
            <button type="button" class="tag" data-severity="blocking" aria-pressed="false" title="Blocking (B)">Blocking</button>
            <button type="button" class="tag" data-severity="important" aria-pressed="false" title="Important (I)">Important</button>
            <button type="button" class="tag" data-severity="nit" aria-pressed="false" title="Nit (N)">Nit</button>
          </div>
        </div>
        <textarea id="comment" rows="3" placeholder="Add a note… (paste or drop an image to attach it)" aria-label="Note"></textarea>
        <div class="composer-images" id="composer-images" hidden></div>
        <div class="actions">
          <button type="button" class="btn ghost" id="point" aria-pressed="false" title="Pick an element on the page">Point</button>
          <button type="button" class="btn ghost" id="attach" title="Attach an image (PNG, JPEG, GIF or WebP); you can also paste or drop one">Image</button>
          <input type="file" id="image-input" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
          <span class="spacer"></span>
          <button type="submit" class="btn ghost" id="add" disabled title="Queue this note (Ctrl+Enter)">Add note</button>
          <button type="button" class="btn primary" id="send" disabled title="Request changes: send the queued notes to the agent">Send</button>
        </div>
        <div class="decide">
          <button type="button" class="btn quiet" id="dismiss" title="Close this review without feedback">Dismiss</button>
          <button type="button" class="btn quiet" id="end" title="End this review for good: nothing more can be sent">End review</button>
          <span class="spacer"></span>
          <button type="button" class="btn ok" id="approve" title="Approve: no further revision needed">Approve</button>
        </div>
        <p class="hint" id="hint">Select text, or press Point and click an element. Notes wait here until you press Send. On a queued note, one key sets its intent (C Q D G) or severity (B I N).</p>
      </form>
    </aside>
  </div>
</div>
</body>
</html>
